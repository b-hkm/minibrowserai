<!DOCTYPE html>

</style>
</head>
<body>
<h1>Round 7 checks</h1>
<!-- implied end tags: no closing li/p/td -->

  <li>second item
  <li>third item

<p>paragraph one
<p>paragraph two
<table border="1">
  <tr><td>r1c1<td>r1c2

<p id="jsout">JS pending...</p>
<script>
  // classList + encodeURIComponent + btoa + navigator + localStorage
  var out = document.getElementById('jsout');
  out.classList.add('ok');
  out.textContent = 'UA: ' + navigator.userAgent.substr(0, 30) + ' | b64: '
    + btoa('hi') + ' | uri: ' + encodeURIComponent('a b');
  localStorage.setItem('visit', '1');
</script>
